name: Launch verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified in run 36085883800
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Pin the supported npm runtime
        run: npm install --global npm@11.9.0 --no-audit --no-fund
      - name: Install locked public build dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit, contract, privacy and route tests
        run: npm test | tee unit-tests.txt
      - name: Build actual Astro output and verify emitted links
        run: npm run build
      - name: Install isolated browser-test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile, local-file privacy and request semantics
        run: python scripts/browser-check.py
      - name: Save exact-head verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prds-launch-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/site/package-lock.json
            apps/site/dist
            apps/site/unit-tests.txt
            apps/site/browser-evidence
