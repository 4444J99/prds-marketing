name: Launch verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install public build dependencies
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Unit, contract, privacy and route tests
        run: npm test | tee unit-tests.txt
      - name: Build actual Astro output and verify emitted links
        run: npm run build
      - name: Install isolated browser-test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile, local-file privacy and request semantics
        run: python scripts/browser-check.py
      - name: Save exact-head verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prds-launch-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/site/package-lock.json
            apps/site/dist
            apps/site/unit-tests.txt
            apps/site/browser-evidence
